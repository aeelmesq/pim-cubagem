services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cubagemcaminhao-sql
    environment:
      ACCEPT_EULA: "Y"
      # A senha vem do arquivo .env (fora do Git). Copie o .env.example para .env.
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Crie o arquivo .env a partir do .env.example}"
      MSSQL_PID: "Developer"
    ports:
      # Só este PC acessa o banco (o túnel para a VPS também sai daqui).
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/CubagemCaminhao.Api/Dockerfile
    container_name: cubagemcaminhao-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CubagemCaminhaoDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  sqlserver_data:
